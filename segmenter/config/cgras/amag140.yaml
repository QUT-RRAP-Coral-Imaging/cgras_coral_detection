# Training configuration for image segmentation

# Project settings
project: "cgras_segmentation"
name: "train_amag140"
model_path: "yolov8n-seg.pt"
yaml_path: "Data/egh490/datasets/segmentation_outputs/2024_acro_model_filtered_split_tiled_balanced/cgras_data.yaml"
task: "segment"  
# Training parameters
classes: [0, 1]  # Coral and Polyp
pretrained: true
epochs: 1000
batch_size: 0.95
workers: 4
save_period: 10
patience: 20
mask_overlap: false
device: 0  # device = [0, 1, 2, 3]
resume: false

# Augmentation parameters
image_size: 640
scale: 0.2
flipud: 0.5
fliplr: 0.5